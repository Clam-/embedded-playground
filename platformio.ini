; PlatformIO Project Configuration
;
; Build/upload for a specific board:
;   pio run -e uno
;   pio run -e esp32 -t upload
;
; Swap the active snippet first:
;   ./use.sh blink
;   ./use.sh serial_hello

[platformio]
default_envs = uno

; ---------- Boards ----------

[env:uno]
platform = atmelavr
board = uno
framework = arduino

[env:due]
platform = atmelsam
board = due
framework = arduino

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:arduino101]
platform = intel_arc32
board = genuino101
framework = arduino
platform_packages = toolchain-intelarc32 @ https://github.com/Clam-/arc-crosstool-ng/releases/download/0.1/toolchain-intelarc32-darwin_arm64.tar.gz
build_flags =
    -D__STDC_HOSTED__=1
    -Wl,-T,ld/flash.ld
